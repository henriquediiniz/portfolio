const $ = id => document.getElementById(id);
const cvs = $("game"), ctx = cvs.getContext("2d");
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const fmt = ms => { const s = ms / 1000, m = Math.floor(s / 60); return m + ":" + (s % 60).toFixed(1).padStart(4, "0"); };
function showBest() { const b = store.get("pf-best"); $("best").textContent = b ? "Seu recorde: " + fmt(+b) : ""; }

// sprites em texto: cada caractere é um pixel
const PAL = { c: "#ff6f59", s: "#ffcfa3", e: "#151935", t: "#4fd1a5", p: "#3b4580", b: "#0b0e22", w: "#ffffff", g: "#b07cff", a: "#e0c8ff", l: "#6f4fb8", y: "#ffc857", d: "#c98f1c" };
const HEAD = ["..cccc..", ".ccccccc", "..sses..", "..ssss..", "...ss..."];
const SPR = {
  idle: [...HEAD, ".tttttt.", "s.tttt.s", "..tttt..", "..pppp..", "..p..p..", "..p..p..", ".bb..bb."],
  run1: [...HEAD, ".tttttt.", "s.tttt.s", "..tttt..", "..pppp..", ".pp..p..", ".p....p.", "bb....bb"],
  run2: [...HEAD, ".tttttt.", ".stttts.", "..tttt..", "..pppp..", "...pp...", "...pp...", "..bbb..."],
  jump: [...HEAD, "stttttts", "..tttt..", "..tttt..", "..pppp..", "..p..pp.", ".bb...b.", "........"],
  dive: [...HEAD, ".tttttt.", "..tttt..", "..ttts..", "..pppy..", "..p.yyy.", ".bb..y..", "........"],
  bug1: [".a....a.", "..a..a..", ".gggggg.", "gwegwegg", "gggggggg", "l.l..l.l"],
  bug2: [".a....a.", "..a..a..", ".gggggg.", "gwegwegg", "gggggggg", ".l.ll.l."],
  trophy: ["yyyyyyy", "y.yyy.y", ".yyyyy.", "..yyy..", "...y...", "..ddd..", ".ddddd."],
  coin: [".yy.", "yddy", "yddy", ".yy."]
};
function drawSpr(name, x, y, scale, flip, alpha) {
  const rows = SPR[name], w = rows[0].length;
  if (alpha != null) ctx.globalAlpha = alpha;
  for (let r = 0; r < rows.length; r++) for (let i = 0; i < w; i++) {
    const ch = rows[r][flip ? w - 1 - i : i];
    if (ch === ".") continue;
    ctx.fillStyle = PAL[ch]; ctx.fillRect(Math.round(x + i * scale), Math.round(y + r * scale), scale, scale);
  }
  ctx.globalAlpha = 1;
}

// som
let actx = null, soundOn = true;
function beep(f1, f2, dur, type = "square", vol = 0.05) {
  if (!soundOn || !actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  jump: () => beep(300, 620, 0.12), dbl: () => beep(500, 900, 0.1), coin: () => { beep(988, 988, 0.06); setTimeout(() => beep(1319, 1319, 0.12), 60); },
  bonk: () => beep(180, 90, 0.1, "square", 0.07), kill: () => beep(700, 120, 0.18, "sawtooth", 0.05), hurt: () => beep(200, 60, 0.25, "sawtooth", 0.06),
  dive: () => beep(900, 200, 0.15, "triangle", 0.06), trophy: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, f, 0.12), i * 80))
};

const G = 0.55, SCALE = 3, PW = 8 * SCALE, PH = 12 * SCALE;
let plats = [], sects = [], items = [], bugs = [], parts = [], pops = [];
let P, keys = {}, running = false, last = 0, t0 = 0, elapsed = 0, score = 0, camY = 0, W = 0, H = 0, dpr = 1;
let quality = 1, slowFrames = 0, measureT = 0, stats;

function measure() {
  const sy = scrollY;
  W = document.documentElement.clientWidth;
  for (const pl of plats) {
    if (pl.el.classList.contains("bump")) continue;
    const r = pl.el.getBoundingClientRect();
    pl.x = pl.ground ? 0 : r.left; pl.w = pl.ground ? W : r.width; pl.y = r.top + sy; pl.h = r.height;
  }
  for (const s of sects) { const r = s.el.getBoundingClientRect(); s.top = r.top + sy; s.bot = r.bottom + sy; }
}
function resize() {
  dpr = quality ? Math.min(devicePixelRatio || 1, 2) : 1;
  H = innerHeight; cvs.width = innerWidth * dpr; cvs.height = H * dpr;
  measure();
}

function setup() {
  plats = [...document.querySelectorAll(".plat")].map(el => ({ el, ground: el.classList.contains("ground"), card: el.classList.contains("card"), coin: el.classList.contains("card"), x: 0, y: 0, w: 0, h: 0 }));
  sects = [...document.querySelectorAll("section.fase")].map(el => ({ el, seen: false, top: 0, bot: 0 }));
  measure();
  const cards = plats.filter(p => p.card && !p.el.classList.contains("premio"));
  items = CONFIG.skills.map((s, i) => {
    const pl = cards[(i * 3 + 1) % cards.length];
    return { kind: "skill", label: s, i, pl, fx: 0.12 + ((i * 0.37) % 0.76), lift: 48 + (i % 2) * 26, got: false, ph: i };
  });
  plats.filter(p => p.el.classList.contains("premio")).forEach(pl => items.push({ kind: "trophy", pl, fx: 0.5, lift: 30, got: false, ph: 0, i: +pl.el.dataset.premio }));
  bugs = plats.filter(p => p.el.classList.contains("bugs")).map((pl, i) => ({ pl, off: 20 + (i * 53) % 120, dir: i % 2 ? 1 : -1, dead: false, sp: 0.9 + (i % 3) * 0.25 }));
  const hero = plats.find(p => p.el.id === "hero");
  P = { x: hero.x + 30, y: hero.y - PH, vx: 0, vy: 0, onGround: true, plat: hero, jumps: 0, face: 1, dive: false, inv: 0, ignore: null, anim: 0 };
  parts = []; pops = []; score = 0; elapsed = 0; camY = scrollY;
  stats = { bugs: 0, coins: 0 };
  document.querySelectorAll(".chips li.got, .premio.got").forEach(e => e.classList.remove("got"));
}

function start() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  $("end").hidden = true;
  document.documentElement.classList.add("playing");
  scrollTo(0, 0);
  cvs.hidden = false; $("hud").hidden = false;
  $("touch").hidden = !matchMedia("(pointer: coarse)").matches;
  quality = 1; resize(); setup();
  running = true; last = performance.now(); t0 = last;
  requestAnimationFrame(loop);
}
function stop() {
  running = false; keys = {};
  document.documentElement.classList.remove("playing");
  cvs.hidden = true; $("hud").hidden = true; $("touch").hidden = true;
}

function burst(x, y, color, n, spd = 3) {
  if (!quality) n = Math.ceil(n / 3);
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = Math.random() * spd; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 30 + Math.random() * 20, c: color }); }
}
function pop(x, y, txt, c = "#ffc857") { pops.push({ x, y, txt, c, life: 50 }); }
const hit = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;

function update(k) {
  const p = P;
  const ax = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (ax) { p.vx += ax * 0.9 * k; p.face = ax; } else p.vx *= Math.pow(p.onGround ? 0.72 : 0.9, k);
  p.vx = Math.max(-4.6, Math.min(4.6, p.vx));
  if (keys.jumpHit) {
    keys.jumpHit = false;
    if (p.onGround) { p.vy = -11.5; p.jumps = 1; p.onGround = false; sfx.jump(); burst(p.x + PW / 2, p.y + PH, "#a6acd8", 6, 1.5); }
    else if (p.jumps < 2) { p.vy = -10; p.jumps = 2; p.dive = false; sfx.dbl(); burst(p.x + PW / 2, p.y + PH, "#4fd1a5", 8, 2); }
  }
  if (keys.downHit) {
    keys.downHit = false;
    if (p.onGround && p.plat && !p.plat.ground) { p.ignore = p.plat; p.onGround = false; p.y += 3; p.vy = 2; }
    else if (!p.onGround && !p.dive) { p.dive = true; p.vy = Math.max(p.vy, 12); p.vx *= 0.3; sfx.dive(); }
  }
  p.vy = Math.min(p.vy + G * k, p.dive ? 17 : 14);
  const prevTop = p.y, prevBot = p.y + PH;
  p.x = Math.max(0, Math.min(W - PW, p.x + p.vx * k));
  p.y += p.vy * k;
  const wasGround = p.onGround; p.onGround = false;
  for (const pl of plats) {
    if (pl === p.ignore || !(p.x + PW > pl.x + 2 && p.x < pl.x + pl.w - 2)) continue;
    if (p.vy >= 0 && prevBot <= pl.y + 1 && p.y + PH >= pl.y) {
      p.y = pl.y - PH; p.vy = 0; p.onGround = true; p.plat = pl; p.jumps = 0;
      if (p.dive) { p.dive = false; burst(p.x + PW / 2, pl.y, "#ffc857", 14, 4); sfx.bonk(); bumpPlat(pl, false); }
      else if (!wasGround) burst(p.x + PW / 2, pl.y, "#a6acd8", 5, 1.2);
      break;
    }
    if (p.vy < 0 && !pl.ground && prevTop >= pl.y + pl.h - 1 && p.y <= pl.y + pl.h) {
      p.y = pl.y + pl.h; p.vy = 1.5; sfx.bonk(); bumpPlat(pl, true);
      break;
    }
  }
  if (p.ignore && (p.y > p.ignore.y + p.ignore.h || p.y + PH < p.ignore.y - 4)) p.ignore = null;
  if (p.inv > 0) p.inv -= k;
  p.anim += Math.abs(p.vx) * k * 0.08;

  for (const b of bugs) {
    if (b.dead) continue;
    const bw = 8 * SCALE, bh = 6 * SCALE;
    b.off += b.dir * b.sp * k;
    if (b.off < 0) { b.off = 0; b.dir = 1; } else if (b.off > b.pl.w - bw) { b.off = b.pl.w - bw; b.dir = -1; }
    const bx = b.pl.x + b.off, by = b.pl.y - bh;
    if (!hit(p.x, p.y, PW, PH, bx, by, bw, bh)) continue;
    if (p.dive || (p.vy > 0 && prevBot <= by + 8)) {
      b.dead = true; stats.bugs++; score += 100; p.vy = -8; p.dive = false; p.jumps = 1;
      sfx.kill(); burst(bx + bw / 2, by + bh / 2, "#b07cff", 16, 3.5); pop(bx, by, "+100 BUG");
    } else if (p.inv <= 0) {
      score = Math.max(0, score - 50); p.inv = 70; p.vx = (p.x < bx ? -1 : 1) * 6; p.vy = -6; p.onGround = false;
      sfx.hurt(); pop(p.x, p.y, "-50", "#ff6f59");
    }
  }

  for (const it of items) {
    if (it.got) continue;
    it.ph += 0.05 * k;
    const ix = it.pl.x + it.fx * it.pl.w - 12, iy = it.pl.y - it.lift + Math.sin(it.ph) * 4;
    if (!hit(p.x, p.y, PW, PH, ix, iy, 24, 22)) continue;
    it.got = true;
    if (it.kind === "skill") {
      score += 25; sfx.coin(); burst(ix + 12, iy + 10, "#4fd1a5", 12); pop(ix, iy, "+25 " + it.label, "#4fd1a5");
      const chip = document.querySelector(`#chips li[data-i="${it.i}"]`); if (chip) chip.classList.add("got");
    } else {
      score += 200; sfx.trophy(); burst(ix + 12, iy + 10, "#ffc857", 24, 4); pop(ix, iy, "+200 TROFÉU");
      const card = document.querySelector(`[data-premio="${it.i}"]`); if (card) card.classList.add("got");
    }
  }

  const cy = p.y + PH / 2;
  for (const s of sects) if (!s.seen && cy > s.top && cy < s.bot) s.seen = true;

  for (const q of parts) { q.x += q.vx * k; q.y += q.vy * k; q.vy += 0.15 * k; q.life -= k; }
  parts = parts.filter(q => q.life > 0);
  for (const q of pops) { q.y -= 0.6 * k; q.life -= k; }
  pops = pops.filter(q => q.life > 0);

  if (p.onGround && p.plat.ground) finish();
}

function bumpPlat(pl, fromBelow) {
  const el = pl.el; el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump");
  setTimeout(() => el.classList.remove("bump"), 220);
  for (const b of bugs) if (!b.dead && b.pl === pl && Math.abs(b.pl.x + b.off - P.x) < 70) {
    b.dead = true; stats.bugs++; score += 100; sfx.kill(); burst(b.pl.x + b.off + 12, pl.y - 9, "#b07cff", 14, 3); pop(b.pl.x + b.off, pl.y - 30, "+100 BUG");
  }
  if (fromBelow && pl.coin) {
    pl.coin = false; stats.coins++; score += 50; sfx.coin();
    const cx = Math.max(pl.x, Math.min(pl.x + pl.w - 12, P.x + 6));
    parts.push({ x: cx, y: pl.y - 10, vx: 0, vy: -6, life: 34, coin: true }); pop(cx, pl.y - 30, "+50");
  }
}

function finish() {
  running = false;
  const seen = sects.filter(s => s.seen).length, sk = items.filter(i => i.kind === "skill"), tr = items.filter(i => i.kind === "trophy");
  const skGot = sk.filter(i => i.got).length, trGot = tr.filter(i => i.got).length, bugTot = bugs.length;
  const totalUnits = sects.length + sk.length + tr.length + bugTot + plats.filter(p => p.card).length;
  const got = seen + skGot + trGot + stats.bugs + stats.coins;
  const pct = Math.round(got / totalUnits * 100);
  const prev = +store.get("pf-best") || 0, rec = !prev || elapsed < prev;
  if (rec) store.set("pf-best", String(Math.round(elapsed)));
  $("end-stats").innerHTML = [
    ["Tempo", fmt(elapsed) + (rec ? " ★ recorde" : "")], ["Pontos", score], ["Skills", `${skGot}/${sk.length}`],
    ["Troféus", `${trGot}/${tr.length}`], ["Bugs derrubados", `${stats.bugs}/${bugTot}`], ["Cards cabeceados", stats.coins], ["Fases vistas", `${seen}/${sects.length}`]
  ].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  $("end-bar").style.width = pct + "%";
  $("end-t").textContent = pct + "% explorado";
  $("end").hidden = false; $("again").focus();
  sfx.trophy(); showBest();
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, innerWidth, H);
  ctx.translate(0, -scrollY);
  const top = scrollY - 60, bot = scrollY + H + 60;
  ctx.font = "10px Silkscreen, monospace"; ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (const it of items) {
    if (it.got) continue;
    const ix = it.pl.x + it.fx * it.pl.w - 12, iy = it.pl.y - it.lift + Math.sin(it.ph) * 4;
    if (iy < top || iy > bot) continue;
    if (it.kind === "trophy") { drawSpr("trophy", ix + 1, iy, 3); continue; }
    ctx.fillStyle = "#0b0e22"; ctx.fillRect(ix - 1, iy - 1, 26, 24);
    ctx.fillStyle = "#4fd1a5"; ctx.fillRect(ix + 2, iy + 2, 20, 18);
    ctx.fillStyle = "#151935"; ctx.fillRect(ix + 6, iy + 6, 12, 10);
    ctx.fillStyle = "#4fd1a5"; ctx.fillRect(ix + 9, iy + 9, 6, 4);
    const tw = ctx.measureText(it.label).width + 8;
    ctx.fillStyle = "#0b0e22cc"; ctx.fillRect(ix + 12 - tw / 2, iy - 15, tw, 13);
    ctx.fillStyle = "#eef0ff"; ctx.fillText(it.label, ix + 12, iy - 13);
  }
  for (const b of bugs) {
    if (b.dead) continue;
    const by = b.pl.y - 18; if (by < top || by > bot) continue;
    drawSpr((Math.floor(performance.now() / 160) % 2) ? "bug1" : "bug2", b.pl.x + b.off, by, 3, b.dir < 0);
  }
  for (const q of parts) {
    if (q.coin) drawSpr("coin", q.x, q.y, 3, false, Math.min(1, q.life / 15));
    else { ctx.fillStyle = q.c; ctx.globalAlpha = Math.min(1, q.life / 20); ctx.fillRect(q.x, q.y, 3, 3); ctx.globalAlpha = 1; }
  }
  const p = P;
  if (!(p.inv > 0 && Math.floor(p.inv / 5) % 2)) {
    const f = p.dive ? "dive" : !p.onGround ? "jump" : Math.abs(p.vx) > 0.6 ? (Math.floor(p.anim) % 2 ? "run1" : "run2") : "idle";
    drawSpr(f, p.x, p.y, SCALE, p.face < 0);
    if (p.dive && quality) { ctx.fillStyle = "#ffc85766"; ctx.fillRect(p.x + 6, p.y - 18, 3, 14); ctx.fillRect(p.x + 15, p.y - 24, 3, 18); }
  }
  ctx.font = "11px Silkscreen, monospace";
  for (const q of pops) { ctx.globalAlpha = Math.min(1, q.life / 20); ctx.fillStyle = "#0b0e22"; ctx.fillText(q.txt, q.x + 13, q.y + 1); ctx.fillStyle = q.c; ctx.fillText(q.txt, q.x + 12, q.y); }
  ctx.globalAlpha = 1;
}

function hud() {
  const sk = items.filter(i => i.kind === "skill");
  $("h-time").textContent = fmt(elapsed);
  $("h-score").textContent = score;
  $("h-skills").textContent = `${sk.filter(i => i.got).length}/${sk.length}`;
  $("h-fases").textContent = `${sects.filter(s => s.seen).length}/${sects.length}`;
}

function loop(now) {
  if (!running) return;
  const dt = Math.min(50, now - last); last = now;
  elapsed += dt;
  // qualidade automática: se ficar lento por ~1,5s, reduz resolução e partículas
  if (quality && dt > 24) { if (++slowFrames > 90) { quality = 0; resize(); } } else slowFrames = Math.max(0, slowFrames - 1);
  measureT += dt; if (measureT > 700) { measureT = 0; measure(); }
  const k = dt / 16.667;
  update(k);
  const maxY = document.documentElement.scrollHeight - H;
  const target = Math.max(0, Math.min(maxY, P.y + PH / 2 - H * 0.42));
  camY += (target - camY) * Math.min(1, 0.14 * k);
  scrollTo(0, Math.round(camY));
  draw(); hud();
  if (running) requestAnimationFrame(loop);
}

/* ---------- controles ---------- */
const KEYMAP = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowDown: "down", KeyS: "down", Space: "jump", ArrowUp: "jump", KeyW: "jump" };
function press(k, on) {
  if (k === "jump" && on && !keys.jump) keys.jumpHit = true;
  if (k === "down" && on && !keys.down) keys.downHit = true;
  keys[k] = on;
}
addEventListener("keydown", e => {
  if (!running) {
    if (e.key === "Enter" && !$("end").hidden) { e.preventDefault(); start(); }
    else if (e.key === "Enter" && document.activeElement === document.body) { e.preventDefault(); start(); }
    else if (e.key === "Escape" && !$("end").hidden) { $("end").hidden = true; stop(); }
    return;
  }
  if (e.key === "Escape") { stop(); return; }
  const k = KEYMAP[e.code]; if (!k) return;
  e.preventDefault(); press(k, true);
});
addEventListener("keyup", e => { const k = KEYMAP[e.code]; if (k) press(k, false); });
addEventListener("blur", () => { keys = {}; });
addEventListener("resize", () => { if (running) resize(); });
document.querySelectorAll(".touch button").forEach(b => {
  const k = b.dataset.k;
  b.addEventListener("pointerdown", e => { e.preventDefault(); b.setPointerCapture(e.pointerId); b.classList.add("on"); press(k, true); });
  const up = () => { b.classList.remove("on"); press(k, false); };
  b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up);
});
$("play").addEventListener("click", start);
$("again").addEventListener("click", start);
$("read").addEventListener("click", () => { $("end").hidden = true; stop(); scrollTo(0, 0); });
$("h-exit").addEventListener("click", stop);
$("h-sound").addEventListener("click", e => { soundOn = !soundOn; e.currentTarget.textContent = "SOM: " + (soundOn ? "ON" : "OFF"); e.currentTarget.blur(); });
</script>
